name: Monitor Multimayorista PistaCierto ASUS

on:
  schedule:
    # Ejecuta a las 09:30h y 16:30h (hora peninsular de invierno)
    - cron: '30 8,15 * * *'
  workflow_dispatch:

jobs:
  analizar-pistacierto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y Chromium
        run: |
          pip install playwright pandas openpyxl
          playwright install chromium

      - name: Ejecutar monitor multimayorista ASUS
        env:
          PC_SESSION: ${{ secrets.PC_SESSION }}
        run: python bot_pistacierto.py

      - name: Comprobar si hay cambios nuevos
        id: check_cambios
        run: |
          if [ -f "cambios_pistacierto.xlsx" ]; then
            echo "hay_cambios=true" >> $GITHUB_OUTPUT
          else
            echo "hay_cambios=false" >> $GITHUB_OUTPUT
          fi

      - name: Enviar alerta por email con el Excel adjunto
        if: steps.check_cambios.outputs.hay_cambios == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "⚠️ PistaCierto ASUS: Cambios de precio por mayorista"
          to: ${{ secrets.MAIL_DESTINO }}
          from: "Bot Precios PistaCierto <${{ secrets.MAIL_USER }}>"
          body: |
            Hola,

            Se han detectado cambios de precio en el catálogo ASUS de PistaCierto desglosados por mayorista (con stock y sin stock).

            Tienes el detalle completo en el archivo Excel adjunto (cambios_pistacierto.xlsx).
          attachments: cambios_pistacierto.xlsx

      - name: Guardar históricos en GitHub
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Bot PistaCierto"
          git add -A
          git commit -m "Actualización automática tarifas ASUS PistaCierto" || exit 0
          git push
